<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: 'Tomorrow', sans-serif;
                height: 100vh;
                background-image: linear-gradient(to top, #2e1753, #1f1746, #131537, #0d1028, #050819);
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden; /* Hides horizontal and vertical overflow */
                flex-direction: column;
                text-align: center;
            }

            .text {
                position: absolute;
                top: 10%;
                color: #fff;
                font-size: 2vw;
            }

            h1 {
                font-size: 5vw;
                margin-bottom: 10px;
            }

            .star {
                position: absolute;
                width: 2px;
                height: 2px;
                background: #fff;
                right: 0;
                animation: starTwinkle 3s infinite linear;
            }

            /* 🚀 Fixed Astronaut: Prevents expanding screen */
            .astronaut img {
                width: 15vw;
                max-width: 120px;
                position: absolute;
                top: 35vh;
                left: -15vw; /* Starts slightly off-screen */
                animation: astronautFly 17s infinite linear;
                user-select: none;
                pointer-events: none;
            }

            .home-button {
                position: absolute;
                top: 65%;
                background-color: #ffffff;
                color: #2e1753;
                padding: 1vw 3vw;
                font-size: 1.5vw;
                font-weight: bold;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: 0.3s ease-in-out;
                text-decoration: none;
            }

            .home-button:hover {
                background-color: #ddd;
                transform: scale(1.1);
            }

            /* 🚀 Fixed Astronaut Animation */
            @keyframes astronautFly {
                0% {
                    left: -15vw; /* Starts just outside the screen */
                }
                25% {
                    top: 30vh;
                    transform: rotate(30deg);
                }
                50% {
                    transform: rotate(45deg);
                    top: 35vh;
                }
                75% {
                    top: 40vh;
                    transform: rotate(30deg);
                }
                100% {
                    left: 100vw; /* Stops at the screen edge instead of going beyond */
                    transform: rotate(45deg);
                }
            }

            @keyframes starTwinkle {
                0% {
                    background: rgba(255, 255, 255, 0.4);
                }
                25% {
                    background: rgba(255, 255, 255, 0.8);
                }
                50% {
                    background: rgba(255, 255, 255, 1);
                }
                75% {
                    background: rgba(255, 255, 255, 0.8);
                }
                100% {
                    background: rgba(255, 255, 255, 0.4);
                }
            }

            /* 📱 Mobile-Friendly Adjustments */
            @media (max-width: 768px) {
                .text {
                    font-size: 4vw;
                }

                h1 {
                    font-size: 8vw;
                }

                .astronaut img {
                    width: 25vw;
                    max-width: 100px;
                    top: 30vh;
                    left: -20vw; /* Prevents screen expansion */
                }

                .home-button {
                    top: 65%;
                    font-size: 3vw;
                    padding: 2vw 5vw;
                }
            }
        </style>
    </head>

    <body>

        <div class="text">
            <div>ERROR</div>
            <h1>404</h1>
            <hr>
            <div>Page Not Found</div>
        </div>

        <div class="astronaut">
            <img src="https://images.vexels.com/media/users/3/152639/isolated/preview/506b575739e90613428cdb399175e2c8-space-astronaut-cartoon-by-vexels.png" alt="Astronaut">
        </div>

        <!-- Home Button -->
        <a href="/" class="home-button">Go Home</a>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                var body = document.body;
                setInterval(createStar, 100);
                function createStar() {
                    var right = Math.random() * 500;
                    var top = Math.random() * screen.height;
                    var star = document.createElement("div");
                    star.classList.add("star");
                    body.appendChild(star);
                    setInterval(runStar, 10);
                    star.style.top = top + "px";
                    function runStar() {
                        if (right >= screen.width) {
                            star.remove();
                        }
                        right += 2;
                        star.style.right = right + "px";
                    }
                }
            });
        </script>

    </body>
</html>
